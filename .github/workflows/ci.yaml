# On push to main: build image -> push to GHCR tagged with the commit SHA ->
# write the new tag into k8s/app.yaml and commit it. Argo CD sees that commit and
# rolls it out. CI never touches the cluster (no kubectl).
name: ci

on:
  push:
    branches: [main]

permissions:
  contents: write  # push the tag-bump commit
  packages: write  # push the image to ghcr.io

env:
  IMAGE: ghcr.io/mikelj14/myinterview-project  # GHCR names must be lowercase

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}

      # Commits made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Bump image tag in git
        run: |
          sed -i "s|^\(\s*image:\).*|\1 ${IMAGE}:${GITHUB_SHA}|" k8s/app.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: ${IMAGE}:${GITHUB_SHA::7}"
          git push
