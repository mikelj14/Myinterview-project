# On push to main: test -> build image -> scan it -> push to GHCR tagged with the
# commit SHA -> write the new tag into k8s/app.yaml and commit it.
# Any failed step stops the job, so a broken or vulnerable image is never deployed. Argo CD sees that commit and
# rolls it out. CI never touches the cluster (no kubectl).
name: ci

on:
  push:
    branches: [main]

permissions:
  contents: write  # push the tag-bump commit
  packages: write  # push the image to ghcr.io

env:
  IMAGE: ghcr.io/mikelj14/myinterview-project  # GHCR names must be lowercase

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # same as the Dockerfile base image

      - name: Unit tests
        run: |
          pip install -r requirements.txt pytest
          pytest -q

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build into the local Docker daemon only; pushed after the scan passes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}

      # Fail on HIGH/CRITICAL CVEs that have a fix available (unfixed ones can't be acted on).
      # Pinned to a commit SHA, not a tag: tags can be moved to malicious code.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        run: docker push ${IMAGE}:${GITHUB_SHA}

      # Commits made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Bump image tag in git
        run: |
          sed -i "s|^\(\s*image:\).*|\1 ${IMAGE}:${GITHUB_SHA}|" k8s/app.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: ${IMAGE}:${GITHUB_SHA::7}"
          git push
