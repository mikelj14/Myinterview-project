# App manifests, synced into the cluster by Argo CD (see argocd/application.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  # no `replicas`: the HPA below owns the count. If it were set here, Argo CD selfHeal
  # would keep resetting it to 2 and fight the HPA.
  selector:
    matchLabels:
      app: myapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below 2 ready pods during a rollout
      maxSurge: 1       # start 1 new pod at a time
  template:
    metadata:
      labels:
        app: myapp
    spec:
      securityContext:
        runAsNonRoot: true # refuse to start if the image would run as root
      containers:
        - name: myapp
          image: ghcr.io/mikelj14/myinterview-project:c444af58d7bcc117318fc57d135fba979c556140
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MESSAGE
              value: "Hello from Kubernetes, zero-downtime test 2!"
          # Ready = receives traffic from the Service. Not ready = removed from endpoints.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          # Alive = keep running. Failing 3 times = kubelet restarts the container.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          # On rollout the pod is removed from the Service endpoints and gets SIGTERM at
          # the same time. Sleeping first lets ingress-nginx stop sending it traffic
          # before gunicorn shuts down; gunicorn then finishes in-flight requests.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: # what the scheduler reserves on a node
              cpu: 50m
              memory: 64Mi
            limits: # hard cap; over memory limit = OOMKilled, over CPU = throttled
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: myapp
spec:
  selector:
    app: myapp
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp
spec:
  ingressClassName: nginx
  rules:
    - http: # no host = matches any hostname, so http://localhost works
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myapp
                port:
                  number: 80
---
# Scale 2-5 pods on CPU. Utilization is measured against the CPU *request* (50m),
# so 70% = ~35m per pod on average. Needs metrics-server (installed by Terraform).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myapp
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
