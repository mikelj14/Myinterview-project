# App manifests, synced into the cluster by Argo CD (see argocd/application.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below 2 ready pods during a rollout
      maxSurge: 1       # start 1 new pod at a time
  template:
    metadata:
      labels:
        app: myapp
    spec:
      securityContext:
        runAsNonRoot: true # refuse to start if the image would run as root
      containers:
        - name: myapp
          image: ghcr.io/mikelj14/myinterview-project:b16266d6e0a91012089731f1789613c56fcf929a
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MESSAGE
              value: "Hello from Kubernetes!"
          # Ready = receives traffic from the Service. Not ready = removed from endpoints.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          # Alive = keep running. Failing 3 times = kubelet restarts the container.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          # On rollout the pod is removed from the Service endpoints and gets SIGTERM at
          # the same time. Sleeping first lets ingress-nginx stop sending it traffic
          # before gunicorn shuts down; gunicorn then finishes in-flight requests.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: # what the scheduler reserves on a node
              cpu: 50m
              memory: 64Mi
            limits: # hard cap; over memory limit = OOMKilled, over CPU = throttled
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: myapp
spec:
  selector:
    app: myapp
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp
spec:
  ingressClassName: nginx
  rules:
    - http: # no host = matches any hostname, so http://localhost works
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: myapp
                port:
                  number: 80
